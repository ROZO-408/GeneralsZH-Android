name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            meson \
            pkg-config \
            python3-pip

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4           
               
      - name: Make package script executable
        run: chmod +x scripts/build/android/package-android-zh.sh

      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
        run: |
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          chmod +x scripts/build/android/package-android-zh.sh
          ./scripts/build/android/package-android-zh.sh
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBuild
          path: |
            android/app/build/outputs/**/*.apk
