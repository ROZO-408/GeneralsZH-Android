name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.1.12297006
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Disable DXVK native windowing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("references/fbraz3-dxvk/meson.build")
          s = p.read_text()
          s = s.replace(
              "error('SDL3, SDL2, or GLFW are required to build dxvk-native')",
              "message('Skipping dxvk-native on Android')"
          )
          p.write_text(s)
          PY

      - name: Verify repository
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -name CMakeLists.txt
          ls -la references
          ls -la references/fbraz3-dxvk

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            meson \
            pkg-config \
            python3-pip \
            cmake \
            glslang-tools

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure CMake
        run: |
          cmake --preset android-vulkan

      - name: Build Native Engine
        run: |
          cmake --build build/android-vulkan --parallel

      - name: Package APK
        run: |
          chmod +x scripts/build/android/package-android-zh.sh
          ./scripts/build/android/package-android-zh.sh

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBuild
          path: |
            android/app/build/outputs/**/*.apk
