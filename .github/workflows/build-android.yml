name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            meson \
            pkg-config \
            python3-pip

      - name: Sync submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Verify source
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -name CMakeLists.txt
          git submodule status

      - name: Configure CMake
        run: |
          cmake -S . -B build/android-game \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DSAGE_USE_SDL3=ON \
            -DSAGE_USE_OPENAL=ON \
            -DSAGE_USE_GLM=ON \
            -DSAGE_DXVK_USE_LOCAL_FORK=ON \
            -DRTS_BUILD_GENERALS=OFF \
            -DRTS_BUILD_CORE_TOOLS=OFF \
            -DRTS_BUILD_ZEROHOUR_TOOLS=OFF \
            -DRTS_BUILD_ZEROHOUR_EXTRAS=OFF \
            -DRTS_BUILD_OPTION_FFMPEG=OFF \
            -DSAGE_UPDATE_CHECK=OFF \
            -DRTS_CRASHDUMP_ENABLE=OFF \
            -DRTS_BUILD_OPTION_SAGE_PATCH=OFF

      - name: Build Android engine
        run: |
          cmake --build build/android-game --parallel

      - name: Package APK
        run: |
          chmod +x scripts/build/android/package-android-zh.sh
          ./scripts/build/android/package-android-zh.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBuild
          path: |
            android/app/build/outputs/**/*.apk
            build/**/*.apk
